# Reversible GPIO input test; never drives PA0/PA1 as outputs.
# Invoke after interface/stlink.cfg and target/stm32f4x.cfg.
adapter serial 001C00363033511735393935
adapter speed 100
reset_config none
init
set saved_mode [mrw 0x40020000]
set saved_pull [mrw 0x4002000c]
set saved_cr1 [mrw 0x40000000]
mww 0x40000000 [expr {$saved_cr1 & ~1}]
set outcome [catch {
    mww 0x40020000 [expr {$saved_mode & ~15}]
    foreach {name bits} {NONE 0 DOWN 10 UP 5} {
        mww 0x4002000c [expr {($saved_pull & ~15) | $bits}]
        sleep 20
        set idr [mrw 0x40020010]
        echo [format "J4_%s: A=%d B=%d IDR=0x%08x" $name [expr {$idr & 1}] [expr {($idr >> 1) & 1}] $idr]
    }
} reason]
mww 0x4002000c $saved_pull
mww 0x40020000 $saved_mode
mww 0x40000000 $saved_cr1
echo [format "RESTORED MODER=0x%08x PUPDR=0x%08x TIM2_CR1=0x%08x" [mrw 0x40020000] [mrw 0x4002000c] [mrw 0x40000000]]
if {$outcome} { echo $reason }
shutdown
