<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <style>
    text{font-family:"Yu Gothic",Meiryo,sans-serif;fill:#172033}
    .wire{fill:none;stroke:#172033;stroke-width:3}
    .box{fill:#fff;stroke:#172033;stroke-width:3}
    .mcu{fill:#fff8cf;stroke:#172033;stroke-width:3}
    .net{font:700 14px Consolas,monospace;fill:#194f83}
    .ref{font:bold 18px Consolas,monospace}
    .value{font:15px "Yu Gothic",sans-serif}
    .pin{font:14px Consolas,monospace}
    .note{font:700 15px "Yu Gothic",sans-serif;fill:#8b2c20}
  </style>
  <rect class="box" x="40" y="60" width="190" height="300"/>
  <text class="ref" x="135" y="90" text-anchor="middle">J701</text>
  <text class="value" x="135" y="115" text-anchor="middle">BM06B-GHS-TBT</text>
  <text class="pin" x="65" y="155">1 GND</text><text class="pin" x="65" y="190">2 SWCLK</text>
  <text class="pin" x="65" y="225">3 SWDIO</text><text class="pin" x="65" y="260">4 NRST</text>
  <text class="pin" x="65" y="295">5 DBG_TX</text><text class="pin" x="65" y="330">6 DBG_RX</text>
  <path class="wire" d="M230 150H420M230 185H420M230 220H420M230 255H420M230 290H420M230 325H420"/>
  <rect class="mcu" x="420" y="60" width="260" height="300"/>
  <text class="ref" x="550" y="90" text-anchor="middle">U301 STM32F405</text>
  <text class="pin" x="445" y="155">GND</text><text class="pin" x="445" y="190">PA14 / SWCLK</text>
  <text class="pin" x="445" y="225">PA13 / SWDIO</text><text class="pin" x="445" y="260">NRST pin 7</text>
  <text class="pin" x="445" y="295">PA2 / USART2_TX</text><text class="pin" x="445" y="330">PA3 / USART2_RX</text>

  <rect class="box" x="750" y="55" width="180" height="180"/>
  <text class="ref" x="840" y="85" text-anchor="middle">SW701</text>
  <text class="value" x="840" y="108" text-anchor="middle">A6S-3104-H</text>
  <text class="pin" x="770" y="145">PC6 / ID0</text><text class="pin" x="770" y="180">PC7 / ID1</text>
  <text class="pin" x="770" y="215">PC8 / ID2</text>
  <path class="wire" d="M930 140H990V230M930 175H990M930 210H990"/>
  <path class="wire" d="M975 230H1005M980 239H1000M986 248H994"/>
  <text class="net" x="1015" y="220">GND</text>
  <text class="note" x="750" y="270">内部pull-up / ON=Low</text>
  <text class="note" x="750" y="295">unitId=4: bit2だけON</text>

  <text class="ref" x="75" y="420">D701 PWR</text><text class="ref" x="310" y="420">D702 RUN</text>
  <text class="ref" x="545" y="420">D703 COMM</text><text class="ref" x="800" y="420">D704 ERR</text>
  <path class="wire" d="M70 385H105M305 385H340M540 385H575M795 385H830"/>
  <rect class="box" x="105" y="370" width="80" height="30"/><rect class="box" x="340" y="370" width="80" height="30"/>
  <rect class="box" x="575" y="370" width="80" height="30"/><rect class="box" x="830" y="370" width="80" height="30"/>
  <text class="pin" x="145" y="391" text-anchor="middle">1 kΩ</text><text class="pin" x="380" y="391" text-anchor="middle">1 kΩ</text>
  <text class="pin" x="615" y="391" text-anchor="middle">1 kΩ</text><text class="pin" x="870" y="391" text-anchor="middle">1 kΩ</text>
  <path class="wire" d="M185 385H215M420 385H450M655 385H685M910 385H940"/>
  <text class="net" x="40" y="390">3V3</text><text class="net" x="260" y="390">PA5</text>
  <text class="net" x="485" y="390">PB10</text><text class="net" x="740" y="390">PB11</text>
  <text class="value" x="80" y="448">green</text><text class="value" x="320" y="448">green</text>
  <text class="value" x="560" y="448">yellow</text><text class="value" x="815" y="448">red</text>
</svg>
