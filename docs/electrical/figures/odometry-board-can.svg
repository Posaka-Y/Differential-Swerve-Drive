<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <style>
    text{font-family:"Yu Gothic",Meiryo,sans-serif;fill:#172033}
    .wire{fill:none;stroke:#172033;stroke-width:3}
    .box{fill:#fff;stroke:#172033;stroke-width:3}
    .mcu{fill:#fff8cf;stroke:#172033;stroke-width:3}
    .net{font:700 15px Consolas,monospace;fill:#194f83}
    .ref{font:bold 18px Consolas,monospace}
    .value{font:15px "Yu Gothic",sans-serif}
    .pin{font:14px Consolas,monospace}
    .note{font:700 15px "Yu Gothic",sans-serif;fill:#8b2c20}
  </style>
  <rect class="mcu" x="40" y="100" width="190" height="175"/>
  <text class="ref" x="135" y="132" text-anchor="middle">U301 STM32F405</text>
  <text class="pin" x="65" y="180">PA12 / CAN1_TX</text>
  <text class="pin" x="65" y="235">PA11 / CAN1_RX</text>
  <path class="wire" d="M230 175H345M230 230H345"/>
  <text class="net" x="250" y="165">COMM_TX</text><text class="net" x="250" y="255">COMM_RX</text>

  <rect class="box" x="345" y="65" width="240" height="270"/>
  <text class="ref" x="465" y="98" text-anchor="middle">U401 TCAN1051VDRQ1</text>
  <text class="pin" x="365" y="180">1 TXD</text><text class="pin" x="365" y="235">4 RXD</text>
  <text class="pin" x="365" y="290">3 VCC = 5V</text>
  <text class="pin" x="485" y="290">5 VIO = 3V3</text>
  <text class="pin" x="505" y="180">7 CANH</text><text class="pin" x="505" y="235">6 CANL</text>
  <text class="pin" x="505" y="320">2 GND / 8 S=GND</text>
  <path class="wire" d="M465 335V365"/>
  <path class="wire" d="M450 365H480M455 374H475M461 383H469"/>
  <path class="wire" d="M585 175H690M585 230H690"/>
  <text class="net" x="600" y="165">COMM_A</text><text class="net" x="600" y="255">COMM_B</text>

  <rect class="box" x="690" y="135" width="150" height="135"/>
  <text class="ref" x="765" y="168" text-anchor="middle">D401</text>
  <text class="value" x="765" y="194" text-anchor="middle">ESD2CAN24</text>
  <text class="pin" x="715" y="225">1=A 2=B</text><text class="pin" x="715" y="250">3=GND</text>
  <path class="wire" d="M765 270V302"/>
  <path class="wire" d="M750 302H780M755 311H775M761 320H769"/>

  <path class="wire" d="M840 175H980M840 230H980"/>
  <rect class="box" x="980" y="70" width="160" height="135"/>
  <text class="ref" x="1060" y="100" text-anchor="middle">J401</text>
  <text class="value" x="1060" y="125" text-anchor="middle">SM03B-GHS-TB</text>
  <text class="pin" x="1005" y="158">1 COMM_A</text><text class="pin" x="1005" y="181">2 COMM_B</text>
  <text class="pin" x="1005" y="198">3 GND</text>
  <rect class="box" x="980" y="245" width="160" height="135"/>
  <text class="ref" x="1060" y="275" text-anchor="middle">J402</text>
  <text class="value" x="1060" y="300" text-anchor="middle">SM03B-GHS-TB</text>
  <text class="pin" x="1005" y="333">1 COMM_A</text><text class="pin" x="1005" y="356">2 COMM_B</text>
  <text class="pin" x="1005" y="373">3 GND</text>
  <path class="wire" d="M900 175V312H980M930 230V340H980"/>

  <path class="wire" d="M625 175V385H690"/>
  <rect class="box" x="690" y="365" width="105" height="40"/>
  <text class="ref" x="742" y="391" text-anchor="middle">R401 120Ω</text>
  <path class="wire" d="M795 385H840"/>
  <rect class="box" x="840" y="365" width="105" height="40"/>
  <text class="ref" x="892" y="391" text-anchor="middle">SW401</text>
  <path class="wire" d="M945 385H965V230"/>
  <path class="wire" d="M405 290V375M405 375V392"/>
  <path class="wire" d="M385 392H425M385 404H425M405 404V430"/>
  <path class="wire" d="M390 430H420M395 439H415M401 448H409"/>
  <text class="ref" x="335" y="400">C401</text><text class="value" x="325" y="422">100 nF</text>
  <path class="wire" d="M505 290V375M505 375V392"/>
  <path class="wire" d="M485 392H525M485 404H525M505 404V430"/>
  <path class="wire" d="M490 430H520M495 439H515M501 448H509"/>
  <text class="ref" x="535" y="400">C402</text><text class="value" x="535" y="422">100 nF</text>
  <text class="note" x="690" y="460">J401/J402は完全並列 / D401はコネクタ直近</text>
</svg>
